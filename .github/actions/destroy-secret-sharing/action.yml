name: "Provision Secret Sharing Service"
description: "Reusable action to provision a Secret Sharing Service for a data product using Terraform."

inputs:
  caller-arn:
    description: "AWS ARN of the calling role"
    required: true
  env:
    description: "Environment (dev, stage, prod)."
    required: true
  contact_email:
    description: "Contact email for the data product team."
    required: true
  contact_name:
    description: "Contact name for the data product team."
    required: true
  accepted_partner_ids:
    description: "JSON array of accepted partner IDs."
    required: false
    default: "[]"
  ecr-repo:
    description: "ECR repository name"
    required: true
  AWS_ACCESS_KEY_ID:
    description: "AWS access key ID for ECR access"
    required: true
  AWS_SECRET_ACCESS_KEY:
    description: "AWS secret access key for ECR access"
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout Platform Repo
      uses: actions/checkout@v4
      with:
        repository: teopopescu/platform-team-repo 
        ref: test/secret_sharing
        path: platform-repo

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Extract AWS Account ID from ARN
      id: extract-account
      shell: bash
      run: |
        ARN="${{ inputs.caller-arn }}"

        # Extract Account ID (digits after '::')
        if [[ "$ARN" =~ arn:aws:iam::([0-9]+): ]]; then
          ACCOUNT_ID="${BASH_REMATCH[1]}"
          echo "AWS_ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "Extracted AWS Account ID: $ACCOUNT_ID"
        else
          echo "::error::Failed to extract AWS Account ID from ARN: $ARN"
          exit 1
        fi

        # Extract Data Product Name (after ba-ecp-github-execution-)
        if [[ "$ARN" =~ ba-ecp-github-execution-([a-zA-Z0-9_-]+)$ ]]; then
          PRODUCT_NAME="${BASH_REMATCH[1]}"
          echo "DATA_PRODUCT_NAME=$PRODUCT_NAME" >> $GITHUB_ENV
          echo "data_product_name=$PRODUCT_NAME" >> $GITHUB_OUTPUT
          echo "Extracted Data Product Name: $PRODUCT_NAME"
        else
          echo "::error::Failed to extract data product name from ARN: $ARN"
          exit 1
        fi

    - name: Terraform Init
      shell: bash
      working-directory: platform-repo/terraform/secret-sharing-main
      run: terraform init

    - name: Terraform Destroy
      shell: bash
      working-directory: platform-repo/terraform/secret-sharing-main
      run: terraform destroy -auto-approve\
                                        -var="accepted_partner_ids=${{ inputs.accepted_partner_ids }}" \
                                        -var="env=${{ inputs.env }}" \
                                        -var="contact_email=${{ inputs.contact_email }}"\
                                        -var="contact_name=${{ inputs.contact_name }}"\
                                        -var="env=${{ inputs.env }}"\
                                        -var="product_name=${{ steps.extract-account.outputs.data_product_name }}"

    - name: Terraform Init
      shell: bash
      working-directory: platform-repo/terraform/secret-sharing-infra
      run: terraform init

    - name: Terraform Destroy
      shell: bash
      working-directory: platform-repo/terraform/secret-sharing-infra
      run: terraform destroy -auto-approve
      